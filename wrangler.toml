name = "cloudcord"
main = "worker/index.js"
compatibility_date = "2026-06-22"

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "VOICE_ROOMS"
class_name = "VoiceRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoiceRoom"]